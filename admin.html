<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    
</head>
<body>
    <style> 
        body {
    font-family: Arial, sans-serif;
    background-color: #cbf3ef;
    margin: 0;
    padding: 0;
}

.container {
    width: 80%;
    margin: 0 auto;
    padding-top: 20px;
}

h1 {
    text-align: center;
    color: #333;
}

section {
    background-color: #fff;
    margin-bottom: 20px;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 5px;
}

button {
    padding: 10px 20px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #45a049;
}

    </style>
    <div class="container">
        <h1>Admin Dashboard</h1>

        <!-- Add Teacher Section -->
        <section id="addTeacher">
            <h2>Add Teacher</h2>
            <form id="addTeacherForm">
                <input type="text" id="teacherName" placeholder="Teacher Name" required>
                <input type="text" id="teacherDept" placeholder="Department" required>
                <input type="text" id="teacherSubject" placeholder="Subject" required>
                <button type="submit">Add Teacher</button>
            </form>
        </section>

        <!-- Update/Delete Teacher Section -->
        <section id="updateDeleteTeacher">
            <h2>Update/Delete Teacher</h2>
            <input type="text" id="teacherId" placeholder="Enter Teacher ID to Update/Delete">
            <button onclick="getTeacherDetails()">Get Teacher Details</button>
            <div id="teacherDetails"></div>
        </section>

        <!-- Approve Student Registration Section -->
        <section id="approveStudent">
            <h2>Approve Student Registration</h2>
            <input type="text" id="studentId" placeholder="Student ID">
            <button onclick="approveStudent()">Approve Registration</button>
        </section>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore.js"></script>
    <script>
        // Firebase Configuration
const firebaseConfig = {
    apiKey: "your-api-key",
    authDomain: "your-auth-domain",
    projectId: "your-project-id",
    storageBucket: "your-storage-bucket",
    messagingSenderId: "your-sender-id",
    appId: "your-app-id"
};

// Initialize Firebase
const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore(app);

// Add Teacher
document.getElementById('addTeacherForm').addEventListener('submit', addTeacher);

function addTeacher(e) {
    e.preventDefault();

    const name = document.getElementById('teacherName').value;
    const dept = document.getElementById('teacherDept').value;
    const subject = document.getElementById('teacherSubject').value;

    // Add teacher to Firestore
    db.collection('teachers').add({
        name: name,
        department: dept,
        subject: subject
    })
    .then(() => {
        alert('Teacher added successfully');
        document.getElementById('addTeacherForm').reset();
    })
    .catch(error => {
        console.error('Error adding teacher:', error);
    });
}

// Get Teacher Details for Update/Delete
function getTeacherDetails() {
    const teacherId = document.getElementById('teacherId').value;

    db.collection('teachers').doc(teacherId).get()
        .then(doc => {
            if (doc.exists) {
                const teacherData = doc.data();
                const teacherDetailsDiv = document.getElementById('teacherDetails');
                teacherDetailsDiv.innerHTML = `
                    <p>Name: ${teacherData.name}</p>
                    <p>Department: ${teacherData.department}</p>
                    <p>Subject: ${teacherData.subject}</p>
                    <button onclick="deleteTeacher('${teacherId}')">Delete Teacher</button>
                    <button onclick="updateTeacher('${teacherId}')">Update Teacher</button>
                `;
            } else {
                alert('Teacher not found');
            }
        })
        .catch(error => {
            console.error('Error getting teacher details:', error);
        });
}

// Delete Teacher
function deleteTeacher(teacherId) {
    db.collection('teachers').doc(teacherId).delete()
        .then(() => {
            alert('Teacher deleted successfully');
            document.getElementById('teacherDetails').innerHTML = '';
        })
        .catch(error => {
            console.error('Error deleting teacher:', error);
        });
}

// Update Teacher (You can expand this to allow editing)
function updateTeacher(teacherId) {
    const name = prompt('Enter new name');
    const dept = prompt('Enter new department');
    const subject = prompt('Enter new subject');

    db.collection('teachers').doc(teacherId).update({
        name: name,
        department: dept,
        subject: subject
    })
    .then(() => {
        alert('Teacher updated successfully');
        document.getElementById('teacherDetails').innerHTML = '';
    })
    .catch(error => {
        console.error('Error updating teacher:', error);
    });
}

// Approve Student Registration
function approveStudent() {
    const studentId = document.getElementById('studentId').value;

    db.collection('students').doc(studentId).update({
        registrationApproved: true
    })
    .then(() => {
        alert('Student registration approved');
    })
    .catch(error => {
        console.error('Error approving student registration:', error);
    });
}

    </script>
</body>
</html>
